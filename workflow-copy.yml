# Builds an installable Android APK every time you upload changes (or when you press "Run workflow").
# The finished APK appears under the run's "Artifacts" section as crystal-echoes-apk.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Works whether the project files are at the top of the repository or inside a folder.
      - name: Find the project folder
        run: |
          PKG=$(find . -name package.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$PKG" ]; then
            echo "::error::package.json was not found in the repository. Upload every file from the unzipped crystal-echoes-android folder."
            exit 1
          fi
          echo "APP_DIR=$(dirname "$PKG")" >> "$GITHUB_ENV"
          echo "Project folder: $(dirname "$PKG")"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Install Capacitor
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      - name: Create the Android project
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx cap add android
          bash scripts/prepare-android.sh
          npx cap sync android

      - name: Build the APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        working-directory: ${{ env.APP_DIR }}
        run: cp android/app/build/outputs/apk/debug/app-debug.apk crystal-echoes.apk

      - uses: actions/upload-artifact@v7
        with:
          name: crystal-echoes-apk
          path: ${{ env.APP_DIR }}/crystal-echoes.apk
