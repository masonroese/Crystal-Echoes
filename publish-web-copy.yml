# Publishes the game to a free web address (GitHub Pages) every time you upload changes.
# iPhone: open the address in Safari -> Share -> Add to Home Screen.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Publish web version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Works whether the project files are at the top of the repository or inside a folder.
      - name: Find the game folder
        run: |
          PKG=$(find . -name package.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$PKG" ]; then echo "::error::package.json not found. Upload the whole project."; exit 1; fi
          echo "WEB_DIR=$(dirname "$PKG")/www" >> "$GITHUB_ENV"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.WEB_DIR }}

      - id: deployment
        uses: actions/deploy-pages@v5
