# Builds an installable Android APK every time you upload changes (or when you press "Run workflow").
# The finished APK appears under the run's "Artifacts" section as crystal-echoes-apk.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Install Capacitor
        run: npm install

      - name: Create the Android project
        run: |
          npx cap add android
          bash scripts/prepare-android.sh
          npx cap sync android

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk crystal-echoes.apk

      - uses: actions/upload-artifact@v7
        with:
          name: crystal-echoes-apk
          path: crystal-echoes.apk
